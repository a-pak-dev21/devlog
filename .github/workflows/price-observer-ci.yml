name: Price Observer CI
run-name: ${{ github.actor }} is runnning tests for Price Observer application
on:
  push:
    paths:
      - "priceObserver/**"
  pull_request:
    paths:
      - "priceObserver/**"
jobs:
  CI-for-Price-Observer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: priceObserver
    env:
      ADMIN_USERNAME: admin
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
    steps:
      - name: Check repository code
        uses: actions/checkout@v6
      - name: Downloading Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installing all dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Running pytest
        run: pytest tests
